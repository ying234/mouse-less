[package]
name = "mouseless-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "my-mouseless"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.16"
mouseless-core.workspace = true
mouseless-overlay.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[target.'cfg(windows)'.dependencies]
mouseless-os-kit.workspace = true

[target.'cfg(unix)'.dependencies]
mouseless-wayland.workspace = true
